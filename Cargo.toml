[workspace]
resolver = "2"
members = ["crates/common", "crates/drive-fetch", "crates/zoom-fetch", "crates/match-speakers", "crates/menubar"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
pipeline-common = { path = "crates/common" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
libc = "0.2"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
